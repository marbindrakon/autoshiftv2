# ClusterSecretStores and ExternalSecrets declared in config.externalSecretsOperator.
#
#   config:
#     externalSecretsOperator:
#       clusterSecretStores:
#         <name>: <ClusterSecretStore spec>
#       externalSecrets:
#         - name: <name>
#           namespace: <namespace>
#           spec: <ExternalSecret spec>
#
# Each spec is applied verbatim, so any provider the operator supports can be used. Only
# references live here: the credentials a store authenticates with, and the values the
# ExternalSecrets resolve, stay in the secret backend. An ExternalSecret is not created until its
# namespace exists, so one that targets an operator namespace settles after that operator installs.
object-templates-raw: |
  {{hub- $cm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $config := (index ($cm.data | default dict) "config" | default "" | fromYaml | default dict) hub}}
  {{hub- $es := (index $config "externalSecretsOperator" | default dict) hub}}
  {{hub- range $name, $spec := (index $es "clusterSecretStores" | default dict) hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: {{hub $name hub}}
      spec:
        {{hub $spec | toYaml | autoindent hub}}
  {{hub- end hub}}
  {{hub- range $secret := (index $es "externalSecrets" | default list) hub}}
  {{hub- if (and (index $secret "name") (index $secret "namespace")) hub}}
  {{- if (lookup "v1" "Namespace" "" "{{hub $secret.namespace hub}}") }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: {{hub $secret.name hub}}
        namespace: {{hub $secret.namespace hub}}
      spec:
        {{hub (index $secret "spec" | default dict) | toYaml | autoindent hub}}
  {{- end }}
  {{hub- end hub}}
  {{hub- end hub}}
