# The operand. The operator installs nothing until this object exists.
# config.externalSecretsOperator.operatorConfig is the spec, verbatim; unset means the operator defaults.
object-templates-raw: |
  {{hub- $cm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $config := (index ($cm.data | default dict) "config" | default "" | fromYaml | default dict) hub}}
  {{hub- $es := (index $config "externalSecretsOperator" | default dict) hub}}
  {{hub- $operatorConfig := (index $es "operatorConfig" | default dict) hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: operator.openshift.io/v1alpha1
      kind: ExternalSecretsConfig
      metadata:
        name: cluster
  {{hub- if (gt (len (keys $operatorConfig)) 0) hub}}
      spec:
        {{hub $operatorConfig | toYaml | autoindent hub}}
  {{hub- end hub}}
