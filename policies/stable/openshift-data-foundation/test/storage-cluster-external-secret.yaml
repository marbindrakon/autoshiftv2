# External mode precondition: the connection details exported from the Ceph cluster must be on
# the cluster before the StorageCluster is created. Nothing in AutoShift creates this Secret,
# because its content is the Ceph cluster's own keys. Wrapped by PG into a musthave
# ConfigurationPolicy; its PG policy entry is remediationAction: inform.
apiVersion: v1
kind: Secret
metadata:
  name: rook-ceph-external-cluster-details
  namespace: openshift-storage
