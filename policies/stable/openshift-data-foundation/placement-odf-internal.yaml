apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-odf-internal
  namespace: ${POLICY_NAMESPACE}
spec:
  # No spec.clusterSets: selected via ManagedClusterSetBindings in this namespace + the predicate.
  # Internal mode: full block + object storage on the cluster's own disks. Skips standalone
  # (NooBaa only) and external (an existing Ceph cluster) modes.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/odf'
              operator: In
              values:
                - 'true'
            - key: 'autoshift.io/odf-multi-cloud-gateway'
              operator: NotIn
              values:
                - 'standalone'
            - key: 'autoshift.io/odf-external'
              operator: NotIn
              values:
                - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
